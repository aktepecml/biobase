server.port=8080

# Native SDK DLL name/path. If the DLL is not on PATH, set an absolute path here
# or pass -Dbiobase.dll.path=C:/Path/To/LScanEssentialsBioBase4.dll.
biobase.dll.path=LScanEssentialsBioBase4

# Captured FIR/BMP/JPG/PNG/XML payloads are written here.
fingerprint.output-dir=captures
fingerprint.default-position=RightIndex
fingerprint.default-impression=FingerprintFlat
# 0 means wait indefinitely. Console mode should keep writing preview until final capture arrives.
fingerprint.capture-timeout-seconds=0
fingerprint.auto-capture-enabled=true
fingerprint.auto-capture-required-objects=1
fingerprint.auto-contrast-enabled=true
fingerprint.image-resolution=500
fingerprint.active-area=0 0 0 0
fingerprint.spoof-detection-enabled=false
fingerprint.auto-capture-override-enabled=true
fingerprint.auto-capture-override-time=4000
fingerprint.auto-capture-override-mode=OnInsufficientCount
# Leave empty unless the device explicitly supports PREVIEW_IMAGE_FORMAT.
fingerprint.preview-image-format=
fingerprint.preview-level=Low
fingerprint.preview-timeout-seconds=5
fingerprint.live-preview-file-enabled=true
fingerprint.live-preview-file-name=preview-live
fingerprint.live-preview-write-interval-millis=100

# Console runner: uygulama acilinca ilk cihazi acar, preview dosyasi yazar,
# capture tamamlaninca final capture dosyasini yazar. REST controller yine calisir.
fingerprint.console-runner-enabled=true
fingerprint.console-close-when-done=false
fingerprint.capture-success-beep-enabled=true
fingerprint.capture-success-beep-pattern=3
fingerprint.capture-success-beep-volume=50
