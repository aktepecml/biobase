server.port=8080
spring.main.headless=false

# Native SDK DLL name/path. If the DLL is not on PATH, set an absolute path here
# or pass -Dbiobase.dll.path=C:/Path/To/LScanEssentialsBioBase4.dll.
biobase.dll.path=LScanEssentialsBioBase4

# Captured FIR/BMP/JPG/PNG/XML payloads are written here.
fingerprint.output-dir=captures
fingerprint.default-position=BothThumbs
fingerprint.default-impression=FingerprintFlat
# 0 means wait indefinitely. Console mode should keep writing preview until final capture arrives.
fingerprint.capture-timeout-seconds=0
fingerprint.auto-capture-enabled=true
fingerprint.auto-capture-required-objects=2
fingerprint.auto-contrast-enabled=true
fingerprint.image-resolution=500
fingerprint.active-area=0 0 0 0
fingerprint.spoof-detection-enabled=false
fingerprint.capture-content-crop-enabled=true
fingerprint.capture-content-crop-padding-pixels=20
fingerprint.auto-capture-override-enabled=true
fingerprint.auto-capture-override-time=4000
fingerprint.auto-capture-override-mode=OnInsufficientCount
# Leave empty unless the device explicitly supports PREVIEW_IMAGE_FORMAT.
fingerprint.preview-image-format=
fingerprint.preview-level=Medium
fingerprint.preview-timeout-seconds=5
fingerprint.preview-payload-cache-enabled=true
# 0 caches every preview payload. Use 33/50/100 to lower Java-side preview copy work.
fingerprint.preview-payload-cache-interval-millis=0
# Keep false for faster live preview; final capture segmentation fallbacks still run.
fingerprint.preview-segmentation-enabled=false
fingerprint.preview-diagnostics-enabled=true
fingerprint.preview-diagnostics-interval-millis=5000
# Patrol flat captures can deliver slow FIR preview callbacks. This mode tries a lighter SDK preview path.
fingerprint.patrol-flat-speed-mode-enabled=true
fingerprint.patrol-flat-preview-level=Low
fingerprint.patrol-flat-auto-contrast-enabled=false

# Console runner: uygulama acilinca ilk cihazi acar, capture tamamlaninca final
# capture dosyasini yazar. REST controller yine calisir.
fingerprint.console-runner-enabled=true
fingerprint.console-close-when-done=false
# Opens a small native Windows preview window and gives its HWND to BioB_SetVisualizationWindow.
fingerprint.native-preview-window-enabled=true
fingerprint.native-preview-window-width=640
fingerprint.native-preview-window-height=480
fingerprint.capture-success-beep-enabled=true
fingerprint.capture-success-beep-pattern=3
fingerprint.capture-success-beep-volume=100
fingerprint.capture-success-beep-delay-millis=200
fingerprint.capture-success-beep-retries=2
fingerprint.capture-progress-beep-enabled=true
fingerprint.capture-progress-beep-pattern=2
fingerprint.capture-progress-beep-volume=100

# Device status LED output is sent through BioB_SetOutputData XML.
# Check /api/fingerprint/devices/{deviceId}/leds or logs for supported names.
fingerprint.led-enabled=true
fingerprint.live-quality-led-enabled=true
fingerprint.capture-clear-leds-on-start=true
fingerprint.capture-start-led=AUTO
fingerprint.capture-success-led=
fingerprint.capture-failure-led=
fingerprint.capture-result-led-duration-millis=1500
