; Configuration file to set logging behavior.

;  3-->TTRACE_TYPE_ERROR,TTRACE_TYPE_WARNING
; 67-->TTRACE_TYPE_ERROR,TTRACE_TYPE_WARNING,TTRACE_TYPE_INFO_INIT
;195-->TTRACE_TYPE_ERROR,TTRACE_TYPE_WARNING,TTRACE_TYPE_INFO_INIT,TTRACE_TYPE_STOP_WATCH
;255-->all traces

[Global]
Filter= 67
FilterCriteria= 1
; FilterCriteria usage:
; 1                 : MISSING only: Apply the value of "Filter" only to the sections that do not have an entry in TTrace.ini file.
; 2                 : Force ALL: Override *all* section's with the value of "Filter".
; 0 or anything else: IGNORE: Do not touch anything (value of "Filter" will do nothing and does *not* alter any behavior).

[LScan_EssentialsBioBase]
Filter= 67

[LScan_Essentials]
Filter= 67

[AC_LogStatistics]
Filter= 67

[LSCAN_Device]
Filter= 67

[LSCAN_Channel]
Filter= 67

[VisApi]
Filter= 67

[VCommands]
Filter= 67