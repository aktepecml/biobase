server.port=8080

# Native SDK DLL name/path. If the DLL is not on PATH, set an absolute path here
# or pass -Dbiobase.dll.path=C:/Path/To/LScanEssentialsBioBase4.dll.
biobase.dll.path=LScanEssentialsBioBase4

# Captured FIR/BMP/JPG/PNG/XML payloads are written here.
fingerprint.output-dir=captures
fingerprint.default-position=RightIndex
fingerprint.default-impression=FingerprintFlat
fingerprint.capture-timeout-seconds=30
